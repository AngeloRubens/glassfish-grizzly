name: HTTP informational response validation

on:
  push:
    branches: [ 'ci/http-informational-*' ]

jobs:
  regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, revert-client, revert-eol]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Maven 3.9.16
        run: |
          curl --fail --silent --show-error -o /tmp/maven.tar.gz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          tar -xzf /tmp/maven.tar.gz -C /tmp
          echo '/tmp/apache-maven-3.9.16/bin' >> "$GITHUB_PATH"
      - name: Restore the production code under test
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = revert-client ]; then
            git restore --source=0fb94c7d7a58233371eec641c7d8f6decef9b66b -- modules/http/src/main/java/org/glassfish/grizzly/http/HttpClientFilter.java
          elif [ "$VARIANT" = revert-eol ]; then
            git restore --source=0fb94c7d7a58233371eec641c7d8f6decef9b66b -- modules/http/src/main/java/org/glassfish/grizzly/http/util/HttpCodecUtils.java
          fi
      - name: Install build dependencies
        run: mvn -B -ntp -pl modules/http -am -DskipTests install
      - name: Run parser regression tests
        id: tests
        continue-on-error: true
        run: mvn -B -ntp -pl modules/http -Dtest=HttpResponseParseTest -DforkCount=1 -DreuseForks=false test
      - name: Verify regression sensitivity
        env:
          VARIANT: ${{ matrix.variant }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          reports = glob.glob('modules/http/target/surefire-reports/TEST-*HttpResponseParseTest*.xml')
          assert reports, 'No parser test reports'
          failed = set()
          executed = set()
          for report in reports:
              for case in ET.parse(report).iter('testcase'):
                  name = case.attrib['name'].split('[')[0]
                  if case.find('skipped') is None:
                      executed.add(name)
                  if case.find('failure') is not None or case.find('error') is not None:
                      failed.add(name)
          client = {'testContinueWithHeadersThenFinalResponse', 'testLfOnlyContinueThenFinalResponse',
                    'testEarlyHintsThenFinalResponse', 'testSwitchingProtocolsAfterInformationalResponse'}
          boundary = {'testHeaderLineEndingAtPacketLimit'}
          cumulative = {'testHeaderLimitAcrossInformationalResponses'}
          assert client | boundary | cumulative <= executed, ('Tests missing', executed)
          variant = os.environ['VARIANT']
          print('Variant:', variant, 'Failing tests:', sorted(failed))
          if variant == 'fixed':
              assert os.environ['TEST_OUTCOME'] == 'success' and not failed, failed
          elif variant == 'revert-client':
              assert failed == client | cumulative, failed
          else:
              assert failed == boundary | cumulative, failed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-reports-${{ matrix.variant }}
          path: modules/http/target/surefire-reports/
