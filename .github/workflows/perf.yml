# A/B performance measurements: baseline (upstream ref) vs this commit.
#  - jmh:  micro-benchmarks of HTTP codec hot paths (perf/jmh), with GC allocation profiling
#  - load: wrk against a hello-world HttpServer + async-profiler CPU/alloc flame graphs
# Results land in the job summaries and as artifacts.

name: Grizzly performance

on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: Baseline repository
        default: eclipse-ee4j/glassfish-grizzly
      base_ref:
        description: Baseline ref
        default: main
      head_ref:
        description: "Head ref of this repository to measure (default = the workflow commit); the benchmark harness always comes from the workflow commit"
        default: ""
      jmh_args:
        description: Extra JMH arguments
        default: ""
      json_check:
        description: "Also run the randomized-order A/B of check_paths (true/false)"
        default: "false"
      check_paths:
        description: "Paths for the randomized-order A/B (space separated); the first one is also profiled"
        default: "plaintext json"
      server_props:
        description: "Extra JVM system properties for the HelloServer of the randomized A/B (e.g. -Dperf.workers=virtual -Dperf.executor=same)"
        default: ""
  push:
    branches: [ "perf/**" ]

env:
  MAVEN_VERSION: 3.9.16
  BASE_REPO: ${{ inputs.base_repo || 'eclipse-ee4j/glassfish-grizzly' }}
  BASE_REF: ${{ inputs.base_ref || 'main' }}
  HEAD_REF: ${{ inputs.head_ref || github.sha }}
  ASYNC_PROFILER_VERSION: "3.0"
  MVN_SKIP: >-
    -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dcheckstyle.skip -Dcopyright.skip -Dspotbugs.skip
    -Denforcer.skip

concurrency:
  group: perf-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build baseline and head
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        path: harness
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.HEAD_REF }}
        path: head
    - uses: actions/checkout@v6
      with:
        repository: ${{ env.BASE_REPO }}
        ref: ${{ env.BASE_REF }}
        path: base
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Install Maven
      run: |
        curl -sSfo maven.tgz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz
        tar -xf maven.tgz
        echo "$PWD/apache-maven-$MAVEN_VERSION/bin" >> $GITHUB_PATH
    - name: Build baseline Grizzly + benchmarks
      run: |
        echo "base: $(git -C base rev-parse HEAD)" | tee -a $GITHUB_STEP_SUMMARY
        mvn $MVN_SKIP -q install -pl modules/http-server,modules/http2 -am -f base/pom.xml
        GV=$(mvn -B -ntp -q -N help:evaluate -Dexpression=project.version -DforceStdout -f base/pom.xml)
        mvn -B -ntp -q package -Dgrizzly.version=$GV -f harness/perf/jmh/pom.xml
        mkdir -p jars && cp harness/perf/jmh/target/benchmarks.jar jars/base.jar
    - name: Build head Grizzly + benchmarks
      run: |
        echo "head: $(git -C head rev-parse HEAD)" | tee -a $GITHUB_STEP_SUMMARY
        mvn $MVN_SKIP -q install -pl modules/http-server,modules/http2 -am -f head/pom.xml
        GV=$(mvn -B -ntp -q -N help:evaluate -Dexpression=project.version -DforceStdout -f head/pom.xml)
        mvn -B -ntp -q clean package -Dgrizzly.version=$GV -f harness/perf/jmh/pom.xml
        cp harness/perf/jmh/target/benchmarks.jar jars/head.jar
        cp -r harness/perf/scripts jars/
        mvn -B -ntp -q package -f harness/perf/netty/pom.xml
        cp harness/perf/netty/target/netty-reference.jar jars/
    - uses: actions/upload-artifact@v4
      with:
        name: jars
        path: jars

  jmh:
    name: JMH A/B
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: jars
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Environment
      run: |
        { echo '```'; lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz'; java -version 2>&1; echo '```'; } | tee -a $GITHUB_STEP_SUMMARY
    - name: Run benchmarks (base, head, interleaved by class)
      run: |
        set -e
        for b in HttpRequestDecodeBenchmark HttpHeaderEncodeBenchmark AttributeHolderBenchmark; do
          for v in base head; do
            java -jar $v.jar "$b" -prof gc -rf json -rff "$v-$b.json" ${{ inputs.jmh_args }} | tail -25
          done
        done
        python3 - <<'EOF'
        import glob, json
        for v in ("base", "head"):
            rows = []
            for f in sorted(glob.glob(f"{v}-*.json")):
                rows += json.load(open(f))
            json.dump(rows, open(f"{v}.json", "w"))
        EOF
    - name: Compare
      run: |
        { echo "## JMH: base vs head (avgt, lower is better)"; python3 scripts/jmh_compare.py base.json head.json; } >> $GITHUB_STEP_SUMMARY
    - name: Profile head decode (async-profiler via JMH)
      continue-on-error: true
      run: |
        sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
        curl -sSfL https://github.com/async-profiler/async-profiler/releases/download/v$ASYNC_PROFILER_VERSION/async-profiler-$ASYNC_PROFILER_VERSION-linux-x64.tar.gz | tar xz
        AP=$PWD/async-profiler-$ASYNC_PROFILER_VERSION-linux-x64/lib/libasyncProfiler.so
        java -jar head.jar HttpRequestDecodeBenchmark -p request=browser -f 1 -wi 3 -i 3 \
            -jvmArgsAppend "-XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints" \
            -prof "async:libPath=$AP;output=collapsed;dir=$PWD/jmh-prof" | tail -5
        f=$(find jmh-prof -name '*.csv' -o -name 'collapsed*' | head -1); echo "profile: $f"
        { echo "## JMH decode[browser] CPU profile (head)"; python3 scripts/top_frames.py "$f" 30; } >> $GITHUB_STEP_SUMMARY
        cp "$f" decode-browser.collapsed
    - uses: actions/upload-artifact@v4
      with:
        name: jmh-results
        path: |
          *.json
          *.collapsed

  load:
    name: Load test + async-profiler
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: jars
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Tools
      run: |
        sudo apt-get install -y -qq wrk nghttp2-client > /dev/null
        sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
        curl -sSfL https://github.com/async-profiler/async-profiler/releases/download/v$ASYNC_PROFILER_VERSION/async-profiler-$ASYNC_PROFILER_VERSION-linux-x64.tar.gz | tar xz
        mv async-profiler-$ASYNC_PROFILER_VERSION-linux-x64 ap
        cat > pipeline.lua <<'EOF'
        init = function(args)
          local depth = tonumber(args[1]) or 16
          local r = {}
          for i = 1, depth do r[i] = wrk.format(nil, wrk.path) end
          req = table.concat(r)
        end
        request = function() return req end
        EOF
        nproc
    - name: Throughput A/B
      run: |
        set -e
        JVM="-Xms512m -Xmx512m -XX:+UseParallelGC"
        TCK=$(getconf CLK_TCK)
        cpu() { awk '{print $14, $15}' /proc/$1/stat; } # utime stime (ticks, all threads)
        csw() { cat /proc/$1/task/*/status 2>/dev/null | awk '/^voluntary_ctxt_switches/ {v+=$2} /^nonvoluntary_ctxt_switches/ {n+=$2} END {print v+0, n+0}'; }
        run() { # variant scenario wrk-args...
          local v=$1 s=$2; shift 2
          taskset -c 0,1 java $JVM $SERVER_PROPS -cp $v.jar org.glassfish.grizzly.perf.HelloServer 8080 > server-$v.log 2>&1 &
          local pid=$!
          for i in $(seq 1 50); do grep -q READY server-$v.log && break; sleep 0.2; done
          taskset -c 2,3 wrk -t2 -c64 -d10s "$@" > /dev/null          # warm-up
          read u0 s0 < <(cpu $pid); read v0 n0 < <(csw $pid)
          taskset -c 2,3 wrk -t2 -c64 -d20s "$@" > wrk-$v-$s.txt
          read u1 s1 < <(cpu $pid); read v1 n1 < <(csw $pid)
          kill $pid; wait $pid || true
          local reqs=$(awk '/requests in/ {print $1}' wrk-$v-$s.txt)
          echo "$v $s $(grep Requests/sec wrk-$v-$s.txt | awk '{print $2}') $reqs $((u1 - u0)) $((s1 - s0)) $TCK $((v1 - v0)) $((n1 - n0))" >> rps.txt
        }
        run_h2() { # variant scenario: HTTP/2 cleartext (prior knowledge) with h2load, 32 connections x 16 streams
          local v=$1 s=$2
          taskset -c 0,1 java $JVM -Dperf.h2=true -cp $v.jar org.glassfish.grizzly.perf.HelloServer 8080 > server-h2-$v.log 2>&1 &
          local pid=$!
          for i in $(seq 1 50); do grep -q READY server-h2-$v.log && break; sleep 0.2; done
          if ! kill -0 $pid 2>/dev/null; then echo "HTTP/2 server did not start:"; tail -20 server-h2-$v.log; return 0; fi
          taskset -c 2,3 h2load -t2 -c32 -m16 -D10 http://127.0.0.1:8080/plaintext > /dev/null
          read u0 s0 < <(cpu $pid); read v0 n0 < <(csw $pid)
          taskset -c 2,3 h2load -t2 -c32 -m16 -D20 http://127.0.0.1:8080/plaintext > h2load-$v-$s.txt
          read u1 s1 < <(cpu $pid); read v1 n1 < <(csw $pid)
          kill $pid; wait $pid || true
          local failed=$(awk '/^requests:/ {print $10}' h2load-$v-$s.txt)
          grep '^requests:' h2load-$v-$s.txt
          if [ "$failed" != "0" ]; then echo "::error::h2load reported $failed failed requests ($v)"; exit 1; fi
          local reqs=$(awk '/^requests:/ {print $2}' h2load-$v-$s.txt)
          local rps=$(awk '/^finished in/ {print $4}' h2load-$v-$s.txt)
          echo "$v $s $rps $reqs $((u1 - u0)) $((s1 - s0)) $TCK $((v1 - v0)) $((n1 - n0))" >> rps.txt
        }
        scenarios() {
          run $1 plaintext http://127.0.0.1:8080/plaintext
          run $1 plaintext-pipelined16 -s pipeline.lua http://127.0.0.1:8080/plaintext -- 16
          run $1 json http://127.0.0.1:8080/json
          run $1 text http://127.0.0.1:8080/text
          run $1 text-small http://127.0.0.1:8080/text-small
          run $1 plaintext-browser-headers "${BROWSER_HEADERS[@]}" "http://127.0.0.1:8080/static/js/app.bundle.js?v=20261013&lang=it"
          run_h2 $1 h2-plaintext
        }
        # a typical browser request: 14 header fields, ~700 bytes
        BROWSER_HEADERS=(
          -H 'Connection: keep-alive'
          -H 'sec-ch-ua: "Chromium";v="130", "Google Chrome";v="130", "Not?A_Brand";v="99"'
          -H 'sec-ch-ua-mobile: ?0'
          -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          -H 'sec-ch-ua-platform: "Linux"'
          -H 'Accept: */*'
          -H 'Sec-Fetch-Site: same-origin'
          -H 'Sec-Fetch-Mode: no-cors'
          -H 'Sec-Fetch-Dest: script'
          -H 'Referer: https://www.example.com/catalog/products?page=2&sort=price'
          -H 'Accept-Encoding: gzip, deflate, br, zstd'
          -H 'Accept-Language: it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7'
          -H 'Cookie: JSESSIONID=8F3A2B1C9D0E4F5A6B7C8D9E0F1A2B3C; _ga=GA1.1.123456789.1700000000; theme=dark; consent=yes'
          -H 'If-None-Match: "5d8c72a5edda8d6a:0"'
        )
        for round in 1 2 3; do # ABBA ordering cancels linear drift
          if [ $((round % 2)) = 1 ]; then scenarios base; scenarios head; else scenarios head; scenarios base; fi
        done
        python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
        import collections, statistics
        d = collections.defaultdict(list)
        for line in open("rps.txt"):
            v, s, rps, reqs, ut, st, tck, vcs, ncs = line.split()
            reqs, tck = int(reqs), int(tck)
            d[(s, v)].append((float(rps), int(ut) / tck / reqs * 1e6, int(st) / tck / reqs * 1e6,
                              (int(vcs) + int(ncs)) / reqs))
        print("## wrk A/B (median of 3 ABBA rounds; server on 2 CPUs, wrk on 2 CPUs)\n")
        print("server CPU per request in µs (user = JVM, sys = kernel); lower is better\n")
        print("| scenario | req/s base | req/s head | Δ | user µs/req base | head | Δ | sys µs/req base | head | ctx switch/req base | head |")
        print("|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|")
        for s in sorted({k[0] for k in d}):
            b = [statistics.median(x) for x in zip(*d[(s, "base")])]
            h = [statistics.median(x) for x in zip(*d[(s, "head")])]
            print(f"| {s} | {b[0]:,.0f} | {h[0]:,.0f} | {(h[0] - b[0]) / b[0] * 100:+.1f}% "
                  f"| {b[1]:.2f} | {h[1]:.2f} | {(h[1] - b[1]) / b[1] * 100:+.1f}% | {b[2]:.2f} | {h[2]:.2f} | {b[3]:.2f} | {h[3]:.2f} |")
        EOF
    - name: Profile head (CPU + alloc)
      run: |
        set -e
        prof() { # variant
          local v=$1
          taskset -c 0,1 java -Xms512m -Xmx512m -XX:+UseParallelGC -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints $SERVER_PROPS \
              -cp $v.jar org.glassfish.grizzly.perf.HelloServer 8080 > prof-$v.log 2>&1 &
          local pid=$!
          for i in $(seq 1 50); do grep -q READY prof-$v.log && break; sleep 0.2; done
          taskset -c 2,3 wrk -t2 -c64 -d75s -s pipeline.lua http://127.0.0.1:8080/plaintext -- 16 > /dev/null &
          local wrk=$!
          sleep 10
          ap/bin/asprof -d 20 -e cpu -i 997us -o collapsed -f $PWD/cpu-$v.collapsed $pid
          ap/bin/asprof -d 15 -e cpu -i 997us -f $PWD/cpu-$v.html $pid
          ap/bin/asprof -d 15 -e alloc -o collapsed -f $PWD/alloc-$v.collapsed $pid
          ap/bin/asprof -d 10 -e alloc -f $PWD/alloc-$v.html $pid
          wait $wrk || true
          kill $pid; wait $pid || true
        }
        prof base
        prof head
        # character output through the Writer (UTF-8 encoding path), head only
        taskset -c 0,1 java -Xms512m -Xmx512m -XX:+UseParallelGC -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints \
            -cp head.jar org.glassfish.grizzly.perf.HelloServer 8080 > prof-text.log 2>&1 &
        pid=$!
        for i in $(seq 1 50); do grep -q READY prof-text.log && break; sleep 0.2; done
        taskset -c 2,3 wrk -t2 -c64 -d40s http://127.0.0.1:8080/text > /dev/null &
        wrkpid=$!
        sleep 10
        ap/bin/asprof -d 20 -e cpu -i 997us -o collapsed -f $PWD/cpu-text-head.collapsed $pid
        wait $wrkpid || true
        kill $pid; wait $pid || true
        # HTTP/2 cleartext with h2load, head only
        taskset -c 0,1 java -Xms512m -Xmx512m -XX:+UseParallelGC -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints \
            -Dperf.h2=true -cp head.jar org.glassfish.grizzly.perf.HelloServer 8080 > prof-h2.log 2>&1 &
        pid=$!
        for i in $(seq 1 50); do grep -q READY prof-h2.log && break; sleep 0.2; done
        taskset -c 2,3 h2load -t2 -c32 -m16 -D50 http://127.0.0.1:8080/plaintext > /dev/null &
        h2pid=$!
        sleep 10
        ap/bin/asprof -d 20 -e cpu -i 997us -o collapsed -f $PWD/cpu-h2-head.collapsed $pid
        ap/bin/asprof -d 15 -e alloc -o collapsed -f $PWD/alloc-h2-head.collapsed $pid
        wait $h2pid || true
        kill $pid; wait $pid || true
        {
          echo "## CPU profile (head, pipelined plaintext)"; python3 scripts/top_frames.py cpu-head.collapsed 30
          echo "## Allocation profile (head)"; python3 scripts/top_frames.py alloc-head.collapsed 20
          echo "## CPU profile (head, /text through the Writer)"; python3 scripts/top_frames.py cpu-text-head.collapsed 30
          echo "## CPU profile (head, HTTP/2 h2c)"; python3 scripts/top_frames.py cpu-h2-head.collapsed 30
          echo "## Allocation profile (head, HTTP/2 h2c)"; python3 scripts/top_frames.py alloc-h2-head.collapsed 20
        } >> $GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: profiles
        path: |
          *.html
          *.collapsed
          wrk-*.txt
          rps.txt
          *.log

  json-check:
    name: Randomized-order A/B (check_paths, profiles)
    if: ${{ inputs.json_check == 'true' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: jars
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Tools
      run: |
        sudo apt-get install -y -qq wrk > /dev/null
        sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
        curl -sSfL https://github.com/async-profiler/async-profiler/releases/download/v$ASYNC_PROFILER_VERSION/async-profiler-$ASYNC_PROFILER_VERSION-linux-x64.tar.gz | tar xz
        mv async-profiler-$ASYNC_PROFILER_VERSION-linux-x64 ap
    - name: Randomized A/B of the check paths
      env:
        CHECK_PATHS: ${{ inputs.check_paths || 'plaintext json' }}
        SERVER_PROPS: ${{ inputs.server_props }}
      run: |
        set -e
        JVM="-Xms512m -Xmx512m -XX:+UseParallelGC"
        TCK=$(getconf CLK_TCK)
        cpu() { awk '{print $14, $15}' /proc/$1/stat; }
        run() { # round variant scenario url
          local r=$1 v=$2 s=$3 url=$4
          taskset -c 0,1 java $JVM $SERVER_PROPS -Xlog:gc:file=gc-$v-$r-$s.log -cp $v.jar org.glassfish.grizzly.perf.HelloServer 8080 > server-$v.log 2>&1 &
          local pid=$!
          for i in $(seq 1 50); do grep -q READY server-$v.log && break; sleep 0.2; done
          taskset -c 2,3 wrk -t2 -c64 -d10s "$url" > /dev/null
          read u0 s0 < <(cpu $pid)
          taskset -c 2,3 wrk -t2 -c64 -d20s "$url" > wrk.txt
          read u1 s1 < <(cpu $pid)
          kill $pid; wait $pid || true
          local reqs=$(awk '/requests in/ {print $1}' wrk.txt)
          echo "$r $v $s $(grep Requests/sec wrk.txt | awk '{print $2}') $reqs $((u1 - u0)) $((s1 - s0)) $TCK" | tee -a json-check.txt
        }
        for round in 1 2 3 4 5 6; do
          for item in $(for p in $CHECK_PATHS; do echo base:$p; echo head:$p; done | shuf --random-source=<(yes $round)); do
            v=${item%%:*}; s=${item##*:}
            run $round $v $s http://127.0.0.1:8080/$s
          done
        done
        python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
        import collections, statistics
        d = collections.defaultdict(list)
        for line in open("json-check.txt"):
            r, v, s, rps, reqs, ut, st, tck = line.split()
            d[(s, v)].append((float(rps), int(ut) / int(tck) / int(reqs) * 1e6, int(st) / int(tck) / int(reqs) * 1e6))
        print("## Randomized A/B, 6 rounds in random order\n")
        print("| scenario | variant | req/s (all rounds) | median req/s | median user µs/req | median sys µs/req |")
        print("|---|---|---|---:|---:|---:|")
        for (s, v), rows in sorted(d.items()):
            print(f"| {s} | {v} | {' '.join(f'{x[0]:,.0f}' for x in rows)} | {statistics.median(x[0] for x in rows):,.0f} "
                  f"| {statistics.median(x[1] for x in rows):.2f} | {statistics.median(x[2] for x in rows):.2f} |")
        PY
    - name: CPU profiles under load of the first check path
      env:
        CHECK_PATHS: ${{ inputs.check_paths || 'plaintext json' }}
        SERVER_PROPS: ${{ inputs.server_props }}
      run: |
        set -e
        p=${CHECK_PATHS%% *}
        for v in base head; do
          taskset -c 0,1 java -Xms512m -Xmx512m -XX:+UseParallelGC -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints $SERVER_PROPS \
              -cp $v.jar org.glassfish.grizzly.perf.HelloServer 8080 > prof-json-$v.log 2>&1 &
          pid=$!
          for i in $(seq 1 50); do grep -q READY prof-json-$v.log && break; sleep 0.2; done
          taskset -c 2,3 wrk -t2 -c64 -d45s http://127.0.0.1:8080/$p > /dev/null &
          wrkpid=$!
          sleep 10
          ap/bin/asprof -d 20 -e cpu -i 997us -o collapsed -f $PWD/cpu-json-$v.collapsed $pid
          ap/bin/asprof -d 10 -e alloc -o collapsed -f $PWD/alloc-json-$v.collapsed $pid
          wait $wrkpid || true
          kill $pid; wait $pid || true
        done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: json-check
        path: |
          json-check.txt
          gc-*.log
          cpu-json-*.collapsed
          alloc-json-*.collapsed
          *.log

  type-pollution:
    name: Type pollution (secondary super cache)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: jars
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Build type-pollution-agent
      run: |
        sudo apt-get install -y -qq wrk maven > /dev/null
        git clone -q --depth 1 https://github.com/RedHatPerf/type-pollution-agent.git tpa
        mvn -B -ntp -q package -DskipTests -f tpa/pom.xml
        ls tpa/agent/target/*.jar
    - name: Load test head with the agent
      run: |
        AGENT=$(ls tpa/agent/target/type-pollution-agent-*.jar | grep -v sources | head -1)
        java -javaagent:$AGENT=org.glassfish.grizzly -Dagent.net.bytebuddy.experimental=true -Xmx512m -cp head.jar org.glassfish.grizzly.perf.HelloServer 8080 > tpa.log 2>&1 &
        pid=$!
        for i in $(seq 1 100); do grep -q READY tpa.log && break; sleep 0.2; done
        wrk -t2 -c64 -d20s http://127.0.0.1:8080/plaintext > /dev/null
        wrk -t2 -c64 -d10s -H 'Connection: keep-alive' http://127.0.0.1:8080/text > /dev/null
        kill $pid; wait $pid || true
        { echo "## Type pollution report (head, plaintext + text load)"; echo '```'; sed -n '/Type Pollution Statistics/,$p' tpa.log | head -150; echo '```'; } >> $GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v4
      with:
        name: type-pollution
        path: tpa.log

  executor-modes:
    name: Hand-off cost (where service() runs)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: jars
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: wrk per executor mode (head)
      run: |
        sudo apt-get install -y -qq wrk nghttp2-client > /dev/null
        TCK=$(getconf CLK_TCK)
        cpu() { awk '{print $14, $15}' /proc/$1/stat; }
        csw() { cat /proc/$1/task/*/status 2>/dev/null | awk '/^voluntary_ctxt_switches/ {v+=$2} /^nonvoluntary_ctxt_switches/ {n+=$2} END {print v+0, n+0}'; }
        syscw() { awk '/^syscw/ {print $2}' /proc/$1/io; }
        run() { # mode scenario url|h2
          local m=$1 s=$2 url=$3
          local h2opt=""; [ "$s" = h2 ] && h2opt="-Dperf.h2=true"
          taskset -c 0,1 java -Xms512m -Xmx512m -XX:+UseParallelGC -Dperf.executor=$m $h2opt -cp head.jar org.glassfish.grizzly.perf.HelloServer 8080 > srv-$m.log 2>&1 &
          local pid=$!
          for i in $(seq 1 50); do grep -q READY srv-$m.log && break; sleep 0.2; done
          if [ "$s" = h2 ]; then
            taskset -c 2,3 h2load -t2 -c32 -m16 -D10 $url > /dev/null
          else
            taskset -c 2,3 wrk -t2 -c64 -d10s $url > /dev/null
          fi
          read u0 s0 < <(cpu $pid); read v0 n0 < <(csw $pid); w0=$(syscw $pid)
          if [ "$s" = h2 ]; then
            taskset -c 2,3 h2load -t2 -c32 -m16 -D20 $url > out-$m-$s.txt
            rps=$(awk '/^finished in/ {print $4}' out-$m-$s.txt); reqs=$(awk '/^requests:/ {print $2}' out-$m-$s.txt)
            grep '^requests:' out-$m-$s.txt
            [ "$(awk '/^requests:/ {print $10}' out-$m-$s.txt)" = "0" ] || { echo "::error::h2load failed requests ($m)"; exit 1; }
          else
            taskset -c 2,3 wrk -t2 -c64 -d20s $url > out-$m-$s.txt
            rps=$(grep Requests/sec out-$m-$s.txt | awk '{print $2}'); reqs=$(awk '/requests in/ {print $1}' out-$m-$s.txt)
          fi
          read u1 s1 < <(cpu $pid); read v1 n1 < <(csw $pid); w1=$(syscw $pid)
          kill $pid; wait $pid || true
          echo "$m $s $rps $reqs $((u1-u0)) $((s1-s0)) $TCK $((v1-v0)) $((n1-n0)) $((w1-w0))" >> modes.txt
        }
        for round in 1 2 3; do
          case $round in 1) order="worker same virtual";; 2) order="same virtual worker";; 3) order="virtual worker same";; esac
          for m in $order; do
            run $m plaintext http://127.0.0.1:8080/plaintext
            run $m text http://127.0.0.1:8080/text
            run $m h2 http://127.0.0.1:8080/plaintext
          done
        done
        python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
        import collections, statistics
        d = collections.defaultdict(list)
        for line in open("modes.txt"):
            m, s, rps, reqs, ut, st, tck, vcs, ncs, scw = line.split()
            reqs, tck = int(reqs), int(tck)
            d[(s, m)].append((float(rps), int(ut) / tck / reqs * 1e6, int(st) / tck / reqs * 1e6, (int(vcs) + int(ncs)) / reqs, int(scw) / reqs))
        print("## Where service() runs (head; median of 3 rounds)\n")
        print("| scenario | mode | req/s | user µs/req | sys µs/req | context switches/req | write syscalls/req |\n|---|---|---:|---:|---:|---:|---:|")
        for s in sorted({k[0] for k in d}):
            for m in ("worker", "same", "virtual"):
                v = [statistics.median(x) for x in zip(*d[(s, m)])]
                print(f"| {s} | {m} | {v[0]:,.0f} | {v[1]:.2f} | {v[2]:.2f} | {v[3]:.2f} | {v[4]:.2f} |")
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: executor-modes
        path: |
          modes.txt
          srv-*.log

  native-baseline:
    name: Native transport headroom (Grizzly vs Netty nio/epoll/io_uring)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: jars
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Tools
      run: |
        sudo apt-get install -y -qq wrk strace > /dev/null
        sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
        echo "io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo n/a) kernel=$(uname -r)" | tee -a $GITHUB_STEP_SUMMARY
        curl -sSfL https://github.com/async-profiler/async-profiler/releases/download/v$ASYNC_PROFILER_VERSION/async-profiler-$ASYNC_PROFILER_VERSION-linux-x64.tar.gz | tar xz
        mv async-profiler-$ASYNC_PROFILER_VERSION-linux-x64 ap
        cat > pipeline.lua <<'LUA'
        init = function(args)
          local depth = tonumber(args[1]) or 16
          local r = {}
          for i = 1, depth do r[i] = wrk.format(nil, wrk.path) end
          req = table.concat(r)
        end
        request = function() return req end
        LUA
    - name: Measure
      run: |
        TCK=$(getconf CLK_TCK)
        JVM="-Xms512m -Xmx512m -XX:+UseParallelGC"
        cpu() { awk '{print $14, $15}' /proc/$1/stat; }
        start() { # name -> starts server, sets PID
          case $1 in
            grizzly-worker) taskset -c 0,1 java $JVM -Dperf.keepAliveMax=-1 -cp head.jar org.glassfish.grizzly.perf.HelloServer 8080 > srv-$1.log 2>&1 & ;;
            grizzly-same)   taskset -c 0,1 java $JVM -Dperf.keepAliveMax=-1 -Dperf.executor=same -cp head.jar org.glassfish.grizzly.perf.HelloServer 8080 > srv-$1.log 2>&1 & ;;
            netty-nio)      taskset -c 0,1 java $JVM -jar netty-reference.jar nio 8080 2 > srv-$1.log 2>&1 & ;;
            netty-epoll)    taskset -c 0,1 java $JVM -jar netty-reference.jar epoll 8080 2 > srv-$1.log 2>&1 & ;;
            netty-io_uring) taskset -c 0,1 java $JVM -jar netty-reference.jar io_uring 8080 2 > srv-$1.log 2>&1 & ;;
          esac
          PID=$!
          for i in $(seq 1 75); do grep -q READY srv-$1.log && break; sleep 0.2; done
          kill -0 $PID 2>/dev/null || { echo "$1 did not start"; tail -20 srv-$1.log; return 1; }
        }
        servers="grizzly-worker grizzly-same netty-nio netty-epoll netty-io_uring"
        for round in 1 2 3; do
          for srv in $servers; do
            for sc in plaintext pipelined16; do
              args="http://127.0.0.1:8080/plaintext"; [ $sc = pipelined16 ] && args="-s pipeline.lua http://127.0.0.1:8080/plaintext -- 16"
              start $srv || continue
              taskset -c 2,3 wrk -t2 -c64 -d10s $args > /dev/null
              read u0 s0 < <(cpu $PID)
              taskset -c 2,3 wrk -t2 -c64 -d20s $args > wrk.txt
              read u1 s1 < <(cpu $PID)
              echo "$srv $sc $(grep Requests/sec wrk.txt | awk '{print $2}') $(awk '/requests in/ {print $1}' wrk.txt) $((u1-u0)) $((s1-s0)) $TCK" >> native.txt
              if [ $round = 1 ]; then
                # syscall mix per request (strace slows the server down: counts only, not timing)
                sudo strace -f -c -q -o strace-$srv-$sc.txt -p $PID &
                st=$!; sleep 1
                taskset -c 2,3 wrk -t2 -c64 -d8s $args > wrk-strace-$srv-$sc.txt
                sudo kill -INT $st 2>/dev/null; wait $st 2>/dev/null || true; sleep 1
                # how many ready connections each epoll_wait returns
                sudo strace -f -e trace=epoll_wait,epoll_pwait -o ew-$srv-$sc.txt -p $PID &
                st=$!; sleep 1
                taskset -c 2,3 wrk -t2 -c64 -d4s $args > /dev/null
                sudo kill -INT $st 2>/dev/null; wait $st 2>/dev/null || true; sleep 1
                # CPU profile with kernel stacks
                taskset -c 2,3 wrk -t2 -c64 -d25s $args > /dev/null &
                w=$!; sleep 3
                ap/bin/asprof -d 15 -e cpu -i 997us -o collapsed -f $PWD/cpu-$srv-$sc.collapsed $PID || true
                wait $w || true
              fi
              kill $PID; wait $PID 2>/dev/null || true
            done
          done
        done
        python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
        import collections, statistics
        d = collections.defaultdict(list)
        for line in open("native.txt"):
            srv, sc, rps, reqs, ut, st, tck = line.split()
            reqs, tck = int(reqs), int(tck)
            d[(sc, srv)].append((float(rps), int(ut) / tck / reqs * 1e6, int(st) / tck / reqs * 1e6))
        print("## Grizzly vs Netty transports (median of 3 rounds; server on 2 CPUs, wrk on 2)\n")
        print("| scenario | server | req/s | user µs/req | sys µs/req |\n|---|---|---:|---:|---:|")
        for sc in ("plaintext", "pipelined16"):
            for srv in ("grizzly-worker", "grizzly-same", "netty-nio", "netty-epoll", "netty-io_uring"):
                if (sc, srv) in d:
                    v = [statistics.median(x) for x in zip(*d[(sc, srv)])]
                    print(f"| {sc} | {srv} | {v[0]:,.0f} | {v[1]:.2f} | {v[2]:.2f} |")
        PY
        python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
        import glob, re, statistics
        print("\n## epoll_wait: ready connections returned per call\n")
        print("| server / scenario | calls | mean ready | returned 0 | timeout ms (most common) |\n|---|---:|---:|---:|---|")
        for f in sorted(glob.glob("ew-*.txt")):
            vals, tmo = [], {}
            for line in open(f):
                m = re.search(r"epoll_p?wait\(\d+, .*?, (\d+), (-?\d+)(?:, [^)]*)?\)\s+=\s+(\d+)", line)
                if m:
                    vals.append(int(m.group(3)))
                    tmo[m.group(2)] = tmo.get(m.group(2), 0) + 1
            if vals:
                common = max(tmo, key=tmo.get)
                print(f"| {f[3:-4]} | {len(vals)} | {statistics.mean(vals):.2f} | {sum(1 for v in vals if v == 0) * 100 / len(vals):.0f}% | {common} |")
        PY
        for f in cpu-*-plaintext.collapsed; do
          { echo; echo "### ${f%.collapsed}"; python3 scripts/kernel_breakdown.py $f; } >> $GITHUB_STEP_SUMMARY
        done
        python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
        import glob, re
        rows = {}
        for f in sorted(glob.glob("strace-*.txt")):
            name = f[len("strace-"):-len(".txt")]
            reqs = 0
            for line in open(f"wrk-strace-{name}.txt"):
                if "requests in" in line:
                    reqs = int(line.split()[0])
            calls = {}
            for line in open(f):
                p = line.split()
                if len(p) >= 5 and re.match(r"^[0-9.]+$", p[0]) and p[-1] != "total":
                    calls[p[-1]] = int(p[3])
            if reqs:
                rows[name] = (reqs, {k: v / reqs for k, v in calls.items()})
        keys = sorted({k for _, c in rows.values() for k, v in c.items() if v >= 0.01}, key=lambda k: -max(c.get(k, 0) for _, c in rows.values()))[:10]
        print("\n## Syscalls per request (strace -c, wrk run inside the trace window)\n")
        print("| server / scenario | total | " + " | ".join(keys) + " |")
        print("|---|---:|" + "---:|" * len(keys))
        for name, (reqs, c) in rows.items():
            print(f"| {name} | {sum(c.values()):.2f} | " + " | ".join(f"{c.get(k, 0):.2f}" for k in keys) + " |")
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-baseline
        path: |
          ew-*.txt
          native.txt
          strace-*.txt
          wrk-strace-*.txt
          cpu-*.collapsed
          srv-*.log

  tls:
    name: TLS (JDK SSLEngine vs OpenSSL; Grizzly vs Netty)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: jars
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Tools and certificate
      run: |
        sudo apt-get install -y -qq wrk > /dev/null
        sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
        curl -sSfL https://github.com/async-profiler/async-profiler/releases/download/v$ASYNC_PROFILER_VERSION/async-profiler-$ASYNC_PROFILER_VERSION-linux-x64.tar.gz | tar xz
        mv async-profiler-$ASYNC_PROFILER_VERSION-linux-x64 ap
        keytool -genkeypair -alias perf -keyalg EC -groupname secp256r1 -dname CN=localhost -validity 3 \
            -storetype PKCS12 -keystore perf.p12 -storepass changeit -keypass changeit
    - name: Debug Grizzly with the OpenSSL engine (one request, FINEST SSL logging)
      run: |
        printf 'handlers=java.util.logging.ConsoleHandler\njava.util.logging.ConsoleHandler.level=ALL\norg.glassfish.grizzly.ssl.level=FINEST\n' > ssl-logging.properties
        java -Dperf.keystore=$PWD/perf.p12 -Dperf.tls=openssl -Dperf.executor=same -Djava.util.logging.config.file=ssl-logging.properties \
            -cp head.jar org.glassfish.grizzly.perf.HelloServer 8443 > debug-openssl.log 2>&1 &
        pid=$!
        for i in $(seq 1 75); do grep -q READY debug-openssl.log && break; sleep 0.2; done
        curl -sv -k --max-time 5 https://127.0.0.1:8443/plaintext 2>&1 | tail -25 || true
        sleep 1; kill $pid; wait $pid 2>/dev/null || true
        grep -v "^\s*at " debug-openssl.log | head -80
    - name: Measure
      run: |
        TCK=$(getconf CLK_TCK)
        JVM="-Xms512m -Xmx512m -XX:+UseParallelGC -Dperf.keystore=$PWD/perf.p12 -Dperf.keepAliveMax=-1"
        cpu() { awk '{print $14, $15}' /proc/$1/stat; }
        start() {
          case $1 in
            grizzly-jdk-worker)  taskset -c 0,1 java $JVM -Dperf.tls=jdk -cp head.jar org.glassfish.grizzly.perf.HelloServer 8443 > srv-$1.log 2>&1 & ;;
            grizzly-jdk-same)    taskset -c 0,1 java $JVM -Dperf.tls=jdk -Dperf.executor=same -cp head.jar org.glassfish.grizzly.perf.HelloServer 8443 > srv-$1.log 2>&1 & ;;
            grizzly-openssl-same) taskset -c 0,1 java $JVM -Dperf.tls=openssl -Dperf.executor=same -cp head.jar org.glassfish.grizzly.perf.HelloServer 8443 > srv-$1.log 2>&1 & ;;
            netty-jdk)           taskset -c 0,1 java $JVM -jar netty-reference.jar nio 8443 2 jdk > srv-$1.log 2>&1 & ;;
            netty-openssl)       taskset -c 0,1 java $JVM -jar netty-reference.jar nio 8443 2 openssl > srv-$1.log 2>&1 & ;;
          esac
          PID=$!
          for i in $(seq 1 75); do grep -q READY srv-$1.log && break; sleep 0.2; done
          kill -0 $PID 2>/dev/null || { echo "$1 did not start"; tail -30 srv-$1.log; return 1; }
        }
        URL=https://127.0.0.1:8443/plaintext
        servers="grizzly-jdk-worker grizzly-jdk-same grizzly-openssl-same netty-jdk netty-openssl"
        for round in 1 2 3; do
          for srv in $servers; do
            for sc in keepalive handshake; do
              hdr=(); [ $sc = handshake ] && hdr=(-H "Connection: close")
              start $srv || continue
              taskset -c 2,3 wrk -t2 -c64 -d10s "${hdr[@]}" $URL > /dev/null
              read u0 s0 < <(cpu $PID)
              taskset -c 2,3 wrk -t2 -c64 -d20s "${hdr[@]}" $URL > wrk-$srv-$sc.txt
              read u1 s1 < <(cpu $PID)
              errs=$(grep -E "Non-2xx|Socket errors" wrk-$srv-$sc.txt | tr '\n' ' ')
              echo "$srv $sc $(grep Requests/sec wrk-$srv-$sc.txt | awk '{print $2}') $(awk '/requests in/ {print $1}' wrk-$srv-$sc.txt) $((u1-u0)) $((s1-s0)) $TCK" >> tls.txt
              [ -n "$errs" ] && echo "$srv $sc: $errs" >> tls-errors.txt
              if [ $round = 1 ] && [ $sc = keepalive ]; then
                taskset -c 2,3 wrk -t2 -c64 -d40s "${hdr[@]}" $URL > /dev/null &
                w=$!; sleep 3
                ap/bin/asprof -d 15 -e cpu -i 997us -o collapsed -f $PWD/cpu-$srv-$sc.collapsed $PID || true
                ap/bin/asprof -d 15 -e alloc -o collapsed -f $PWD/alloc-$srv-$sc.collapsed $PID || true
                wait $w || true
              fi
              kill $PID; wait $PID 2>/dev/null || true
            done
          done
        done
        python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
        import collections, statistics
        d = collections.defaultdict(list)
        for line in open("tls.txt"):
            srv, sc, rps, reqs, ut, st, tck = line.split()
            reqs, tck = int(reqs), int(tck)
            d[(sc, srv)].append((float(rps), int(ut) / tck / reqs * 1e6, int(st) / tck / reqs * 1e6))
        print("## TLS 1.3 over loopback (median of 3 rounds; server on 2 CPUs, wrk on 2)\\n")
        print("keepalive = 64 persistent connections; handshake = new connection (full TLS handshake) per request\\n")
        print("| scenario | server | req/s | user µs/req | sys µs/req |\\n|---|---|---:|---:|---:|")
        for sc in ("keepalive", "handshake"):
            for srv in ("grizzly-jdk-worker", "grizzly-jdk-same", "grizzly-openssl-same", "netty-jdk", "netty-openssl"):
                if (sc, srv) in d:
                    v = [statistics.median(x) for x in zip(*d[(sc, srv)])]
                    print(f"| {sc} | {srv} | {v[0]:,.0f} | {v[1]:.2f} | {v[2]:.2f} |")
        PY
        [ -f tls-errors.txt ] && { echo; echo '### wrk errors'; echo '```'; cat tls-errors.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY || true
        for f in cpu-*.collapsed; do { echo; echo "### ${f%.collapsed}"; python3 scripts/top_frames.py $f 15; } >> $GITHUB_STEP_SUMMARY; done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tls
        path: |
          tls.txt
          tls-errors.txt
          wrk-*.txt
          cpu-*.collapsed
          alloc-*.collapsed
          srv-*.log
